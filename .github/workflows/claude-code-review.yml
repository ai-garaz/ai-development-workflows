name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Provide a code review for the given pull request.

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            **Agent assumptions (applies to all agents and subagents):**
            - All tools are functional and will work without error. Do not test tools or make exploratory calls.
            - Only call a tool if it is required to complete the task. Every tool call should have a clear purpose.

            To do this, follow these steps precisely:

            ## Step 1: Pre-flight Check
            Launch a haiku agent to check if any of the following are true:
            - The pull request is closed
            - The pull request is a draft
            - The pull request does not need code review (e.g. automated PR, trivial change that is obviously correct)
            - Claude has already commented on this PR (check `gh pr view <PR> --comments` for comments left by claude)

            If any condition is true, stop and do not proceed. Note: Still review Claude-generated PRs.

            ## Step 2: Gather Context
            Launch a haiku agent to:
            - List all files in your project's coding rules directory (e.g., `.cursor/rules/`, `.github/copilot-instructions.md`, `CLAUDE.md`, or wherever your team stores coding standards)
            - Check if a requirements document / PRD exists for this PR by looking for references in the PR title, branch name, or linked issues
            - Return the paths to coding rules and the requirements doc (if found)

            ## Step 3: PR Summary
            Launch a sonnet agent to view the pull request and return a summary of the changes.

            ## Step 4: Parallel Review
            Launch 5 agents in parallel to independently review the changes. Each agent should return a list of issues, where each issue includes a description, the file/line, and the reason it was flagged.

            **Agents 1 + 2: Coding Rules Compliance (Sonnet)**
            Audit changes for compliance with your project's coding rules. Read the relevant rule files found in Step 2.

            Only flag clear, unambiguous rule violations where you can quote the exact rule being broken.

            **Agent 3: Bug Detection (Opus)**
            Scan for obvious bugs. Focus only on the diff itself without reading extra context. Flag only significant bugs; ignore nitpicks and likely false positives. Do not flag issues that you cannot validate without looking at context outside of the git diff.

            **Agent 4: Security & Logic (Opus)**
            Look for problems in the introduced code: security issues, incorrect logic, etc. Only look for issues that fall within the changed code.

            **Agent 5: Requirements Validation (Opus)**
            If a requirements document / PRD was found in Step 2:
            - Read the document thoroughly
            - Compare the implementation against the requirements
            - Flag any requirements that appear unimplemented or incorrectly implemented
            - Flag any implementation that deviates from the specification
            If no requirements doc found, skip this agent and note "No requirements document found for this PR."

            **CRITICAL: We only want HIGH SIGNAL issues.** Flag issues where:
            - The code will fail to compile or parse (syntax errors, type errors, missing imports, unresolved references)
            - The code will definitely produce wrong results regardless of inputs (clear logic errors)
            - Clear, unambiguous coding rule violations where you can quote the exact rule being broken
            - Requirements that are clearly unimplemented or incorrectly implemented

            Do NOT flag:
            - Code style or quality concerns not covered by your rules
            - Potential issues that depend on specific inputs or state
            - Subjective suggestions or improvements
            - Pre-existing issues
            - Issues that a linter will catch

            If you are not certain an issue is real, do not flag it. False positives erode trust and waste reviewer time.

            Each subagent should be told the PR title and description for context.

            ## Step 5: Validate Issues
            For each issue found in Step 4, launch parallel subagents to validate the issue with high confidence:
            - Use Opus subagents for bugs, logic, and requirements issues
            - Use Sonnet subagents for coding rule violations

            The subagent's job is to review and validate that the stated issue is truly an issue. For example:
            - For "variable is not defined": validate that it's actually undefined in the code
            - For coding rule violations: validate the rule applies to this file and is actually violated
            - For requirements issues: validate the requirement exists and is truly unimplemented

            ## Step 6: Filter Results
            Filter out any issues that were not validated in Step 5. This gives us our list of high-signal issues.

            ## Step 7: Post Results
            If NO issues were found, post a summary comment using `gh pr comment`:
            "## Code Review\n\nNo issues found. Checked for bugs, security, coding rules compliance, and requirements implementation."

            If issues were found, skip to Step 8.

            ## Step 8: Prepare Comments
            Create a list of all comments you plan on leaving. This is only for internal verification.

            ## Step 9: Post Inline Comments
            Post inline comments for each issue using `mcp__github_inline_comment__create_inline_comment`. For each comment:
            - Provide a brief description of the issue
            - For small, self-contained fixes, include a committable suggestion block
            - For larger fixes (6+ lines, structural changes, or multi-location changes), describe the issue and suggested fix without a suggestion block
            - Cite and link to the coding rule or requirements section being violated

            **IMPORTANT: Only post ONE comment per unique issue. Do not post duplicate comments.**

            When linking to code, use this format precisely:
            `https://github.com/OWNER/REPO/blob/FULL_SHA/path/to/file.ts#L10-L15`
            - Requires full git SHA (not HEAD or branch name)
            - Use # sign after file name
            - Line range format is L[start]-L[end]
            - Provide at least 1 line of context before and after

            **Additional Notes:**
            - Use gh CLI to interact with GitHub. Do not use web fetch.
            - Create a todo list before starting.
            - NEVER read package-lock.json or yarn.lock files!

          claude_args:
            --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
            --model "opus"
